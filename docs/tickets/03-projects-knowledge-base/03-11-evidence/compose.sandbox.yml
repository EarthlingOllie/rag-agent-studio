# Sandbox-only override for `make services` and `make e2e`: the stack runs the images build.sh
# just built (the committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off),
# and host ports move so this stack runs beside other tickets' stacks on the same Docker daemon.
# Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["43132:5432"]
  redis:
    ports: !override ["43179:6379"]
  rustfs:
    ports: !override ["43190:9000", "43191:9001"]
  mailpit:
    ports: !override ["43125:1025", "43126:8025"]
  api:
    image: rag-agent-studio/api:0311
    build: !reset null
    pull_policy: never
    ports: !override ["43180:8000"]
  worker:
    image: rag-agent-studio/api:0311
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0311
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0311
    build: !reset null
    pull_policy: never
    ports: !override ["43173:5173"]
