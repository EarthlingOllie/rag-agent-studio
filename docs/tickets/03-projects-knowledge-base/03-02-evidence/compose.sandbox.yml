# Sandbox-only override: images built by build.sh (the committed Dockerfiles plus the proxy CA,
# without PDF models), and host ports moved so this stack runs beside other tickets' stacks.
services:
  postgres:
    ports: !override ["45732:5432"]
  redis:
    ports: !override ["46679:6379"]
  rustfs:
    ports: !override ["49300:9000", "49301:9001"]
  mailpit:
    ports: !override ["41325:1025", "48325:8025"]
  api:
    image: rag-agent-studio/api:0302
    pull_policy: never
    ports: !override ["48300:8000"]
  worker:
    image: rag-agent-studio/api:0302
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0302
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0302
    pull_policy: never
    ports: !override ["45473:5173"]
