# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own build
# can't add the CA), and host ports move so this stack runs
# beside other tickets' stacks on the same Docker daemon. The API's and Studio's health checks get
# a longer timeout: with eight tickets building in parallel the load average was above 40, and
# a 3 s check timed out while the API was in fact serving. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["57732:5432"]
  redis:
    ports: !override ["57679:6379"]
  rustfs:
    ports: !override ["57900:9000", "57901:9001"]
  mailpit:
    ports: !override ["57025:1025", "57825:8025"]
  api:
    image: rag-agent-studio/api:0305
    build: !reset null
    pull_policy: never
    ports: !override ["57800:8000"]
    healthcheck:
      timeout: 30s
      retries: 60
  worker:
    image: rag-agent-studio/api:0305
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0305
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0305
    build: !reset null
    pull_policy: never
    ports: !override ["57473:5173"]
    healthcheck:
      timeout: 30s
      retries: 60
