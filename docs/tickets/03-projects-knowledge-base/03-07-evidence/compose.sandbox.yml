# Sandbox-only override for `make services` and `make e2e`: the stack runs the images build.sh
# just built (the committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off),
# and host ports move so this stack runs beside other tickets' stacks on the same Docker daemon.
# Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["40732:5432"]
  redis:
    ports: !override ["40779:6379"]
  rustfs:
    ports: !override ["40790:9000", "40791:9001"]
  mailpit:
    ports: !override ["40725:1025", "40726:8025"]
  api:
    image: rag-agent-studio/api:0307
    build: !reset null
    pull_policy: never
    ports: !override ["40780:8000"]
  worker:
    image: rag-agent-studio/api:0307
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0307
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0307
    build: !reset null
    pull_policy: never
    ports: !override ["40773:5173"]
