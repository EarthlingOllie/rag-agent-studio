# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["38142:5432"]
  redis:
    ports: !override ["38189:6379"]
  rustfs:
    ports: !override ["38110:9000", "38111:9001"]
  mailpit:
    ports: !override ["38125:1025", "38185:8025"]
  api:
    image: rag-agent-studio/api:0805
    build: !reset null
    pull_policy: never
    ports: !override ["38180:8000"]
  worker:
    image: rag-agent-studio/api:0805
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0805
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0805
    build: !reset null
    pull_policy: never
    ports: !override ["38183:5173"]
  widget:
    image: rag-agent-studio/studio:0805
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0805
    build: !reset null
    pull_policy: never
    ports: !override ["38175:5175"]
