# Sandbox-only override: images built by build.sh (the committed Dockerfiles plus the proxy CA),
# and host ports moved so this stack runs beside other tickets' stacks on the same Docker daemon.
services:
  postgres:
    ports: !override ["52432:5432"]
  redis:
    ports: !override ["52379:6379"]
  rustfs:
    ports: !override ["52900:9000", "52901:9001"]
  mailpit:
    ports: !override ["52025:1025", "52825:8025"]
  api:
    image: rag-agent-studio/api:0204
    pull_policy: never
    ports: !override ["52800:8000"]
  worker:
    image: rag-agent-studio/api:0204
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0204
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0204
    pull_policy: never
    ports: !override ["52173:5173"]
