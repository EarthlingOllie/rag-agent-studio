# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack (compose project rag0206) runs beside
# other tickets' stacks on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["45632:5432"]
  redis:
    ports: !override ["46206:6379"]
  rustfs:
    ports: !override ["49206:9000", "49207:9001"]
  mailpit:
    ports: !override ["41206:1025", "48216:8025"]
  api:
    image: rag-agent-studio/api:0206
    build: !reset null
    pull_policy: never
    ports: !override ["48260:8000"]
  worker:
    image: rag-agent-studio/api:0206
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0206
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0206
    build: !reset null
    pull_policy: never
    ports: !override ["45206:5173"]
