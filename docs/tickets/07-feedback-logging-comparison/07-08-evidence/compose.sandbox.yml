# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["46142:5432"]
  redis:
    ports: !override ["46189:6379"]
  rustfs:
    ports: !override ["46110:9000", "46111:9001"]
  mailpit:
    ports: !override ["46125:1025", "46185:8025"]
  api:
    image: rag-agent-studio/api:0708
    build: !reset null
    pull_policy: never
    ports: !override ["46180:8000"]
  worker:
    image: rag-agent-studio/api:0708
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0708
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0708
    build: !reset null
    pull_policy: never
    ports: !override ["46183:5173"]
  widget:
    image: rag-agent-studio/studio:0708
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0708
    build: !reset null
    pull_policy: never
    ports: !override ["46175:5175", "46176:5176"]
