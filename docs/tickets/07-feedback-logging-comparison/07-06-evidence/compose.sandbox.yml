# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["47642:5432"]
  redis:
    ports: !override ["47689:6379"]
  rustfs:
    ports: !override ["47610:9000", "47611:9001"]
  mailpit:
    ports: !override ["47625:1025", "47685:8025"]
  api:
    image: rag-agent-studio/api:0706
    build: !reset null
    pull_policy: never
    ports: !override ["47680:8000"]
  worker:
    image: rag-agent-studio/api:0706
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0706
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0706
    build: !reset null
    pull_policy: never
    ports: !override ["47683:5173"]
  widget:
    image: rag-agent-studio/studio:0706
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0706
    build: !reset null
    pull_policy: never
    ports: !override ["47675:5175", "47676:5176"]
