# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["47442:5432"]
  redis:
    ports: !override ["47489:6379"]
  rustfs:
    ports: !override ["47410:9000", "47411:9001"]
  mailpit:
    ports: !override ["47425:1025", "47485:8025"]
  api:
    image: rag-agent-studio/api:0704
    build: !reset null
    pull_policy: never
    ports: !override ["47480:8000"]
  worker:
    image: rag-agent-studio/api:0704
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0704
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0704
    build: !reset null
    pull_policy: never
    ports: !override ["47483:5173"]
  widget:
    image: rag-agent-studio/studio:0704
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0704
    build: !reset null
    pull_policy: never
    ports: !override ["47475:5175"]
