# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["45542:5432"]
  redis:
    ports: !override ["45589:6379"]
  rustfs:
    ports: !override ["45510:9000", "45511:9001"]
  mailpit:
    ports: !override ["45525:1025", "45585:8025"]
  api:
    image: rag-agent-studio/api:0605
    build: !reset null
    pull_policy: never
    ports: !override ["45580:8000"]
  worker:
    image: rag-agent-studio/api:0605
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0605
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0605
    build: !reset null
    pull_policy: never
    ports: !override ["45583:5173"]
  widget:
    image: rag-agent-studio/studio:0605
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0605
    build: !reset null
    pull_policy: never
    ports: !override ["45575:5175"]
