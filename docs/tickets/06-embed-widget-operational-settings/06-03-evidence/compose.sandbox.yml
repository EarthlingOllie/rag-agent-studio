# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["49742:5432"]
  redis:
    ports: !override ["49789:6379"]
  rustfs:
    ports: !override ["49710:9000", "49711:9001"]
  mailpit:
    ports: !override ["49725:1025", "49785:8025"]
  api:
    image: rag-agent-studio/api:0603
    build: !reset null
    pull_policy: never
    ports: !override ["49780:8000"]
  worker:
    image: rag-agent-studio/api:0603
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0603
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0603
    build: !reset null
    pull_policy: never
    ports: !override ["49783:5173"]
  widget:
    image: rag-agent-studio/studio:0603
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:0603
    build: !reset null
    pull_policy: never
    ports: !override ["49775:5175"]
