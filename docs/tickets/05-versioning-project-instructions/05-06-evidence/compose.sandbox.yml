# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["46732:5432"]
  redis:
    ports: !override ["46779:6379"]
  rustfs:
    ports: !override ["46791:9000", "46792:9001"]
  mailpit:
    ports: !override ["46725:1025", "46726:8025"]
  api:
    image: rag-agent-studio/api:0506
    build: !reset null
    pull_policy: never
    ports: !override ["46710:8000"]
  worker:
    image: rag-agent-studio/api:0506
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0506
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0506
    build: !reset null
    pull_policy: never
    ports: !override ["46783:5173"]
