# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["45742:5432"]
  redis:
    ports: !override ["45689:6379"]
  rustfs:
    ports: !override ["45310:9000", "45311:9001"]
  mailpit:
    ports: !override ["45325:1025", "45825:8025"]
  api:
    image: rag-agent-studio/api:0504
    build: !reset null
    pull_policy: never
    ports: !override ["45810:8000"]
  worker:
    image: rag-agent-studio/api:0504
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0504
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0504
    build: !reset null
    pull_policy: never
    ports: !override ["45483:5173"]
