# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["49742:5432"]
  redis:
    ports: !override ["49689:6379"]
  rustfs:
    ports: !override ["49310:9000", "49311:9001"]
  mailpit:
    ports: !override ["49325:1025", "49825:8025"]
  api:
    image: rag-agent-studio/api:0503
    build: !reset null
    pull_policy: never
    ports: !override ["49810:8000"]
  worker:
    image: rag-agent-studio/api:0503
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0503
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0503
    build: !reset null
    pull_policy: never
    ports: !override ["49483:5173"]
