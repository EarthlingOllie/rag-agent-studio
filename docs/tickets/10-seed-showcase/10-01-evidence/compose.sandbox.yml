# Sandbox-only override for `make e2e` and `make seed`: the stack runs the images build.sh just
# built (the committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off;
# compose's own build can't add the CA), and host ports move so this stack runs beside other
# tickets' stacks on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["41132:5432"]
  redis:
    ports: !override ["41179:6379"]
  rustfs:
    ports: !override ["41190:9000", "41191:9001"]
  mailpit:
    ports: !override ["41125:1025", "41185:8025"]
  api:
    image: rag-agent-studio/api:1001
    build: !reset null
    pull_policy: never
    ports: !override ["41180:8000"]
  worker:
    image: rag-agent-studio/api:1001
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:1001
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:1001
    build: !reset null
    pull_policy: never
    ports: !override ["41173:5173"]
