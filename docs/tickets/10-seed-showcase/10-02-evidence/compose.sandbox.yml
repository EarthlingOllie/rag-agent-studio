# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["41442:5432"]
  redis:
    ports: !override ["41489:6379"]
  rustfs:
    ports: !override ["41410:9000", "41411:9001"]
  mailpit:
    ports: !override ["41425:1025", "41485:8025"]
  api:
    image: rag-agent-studio/api:1002
    build: !reset null
    pull_policy: never
    ports: !override ["41480:8000"]
  worker:
    image: rag-agent-studio/api:1002
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:1002
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:1002
    build: !reset null
    pull_policy: never
    ports: !override ["41483:5173"]
  widget:
    image: rag-agent-studio/studio:1002
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:1002
    build: !reset null
    pull_policy: never
    ports: !override ["41475:5175", "41476:5176"]
