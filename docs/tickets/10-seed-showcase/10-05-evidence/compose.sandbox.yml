# Sandbox-only override for `make e2e` (ticket 10-05, copied from 10-03 with its own ports and image tag): the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["31542:5432"]
  redis:
    ports: !override ["31589:6379"]
  rustfs:
    ports: !override ["31510:9000", "31511:9001"]
  mailpit:
    ports: !override ["31525:1025", "31585:8025"]
  api:
    image: rag-agent-studio/api:1005
    build: !reset null
    pull_policy: never
    ports: !override ["31580:8000"]
  worker:
    image: rag-agent-studio/api:1005
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:1005
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:1005
    build: !reset null
    pull_policy: never
    ports: !override ["31583:5173"]
  widget:
    image: rag-agent-studio/studio:1005
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:1005
    build: !reset null
    pull_policy: never
    ports: !override ["31575:5175", "31576:5176"]
