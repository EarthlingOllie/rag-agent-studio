# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF off and the models bundled; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["49442:5432"]
  redis:
    ports: !override ["49489:6379"]
  rustfs:
    ports: !override ["49410:9000", "49411:9001"]
  mailpit:
    ports: !override ["49425:1025", "49485:8025"]
  api:
    image: rag-agent-studio/api:1003
    build: !reset null
    pull_policy: never
    ports: !override ["49480:8000"]
  worker:
    image: rag-agent-studio/api:1003
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:1003
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:1003
    build: !reset null
    pull_policy: never
    ports: !override ["49483:5173"]
  widget:
    image: rag-agent-studio/studio:1003
    build: !reset null
    pull_policy: never
  host:
    image: rag-agent-studio/studio:1003
    build: !reset null
    pull_policy: never
    ports: !override ["49475:5175", "49476:5176"]
