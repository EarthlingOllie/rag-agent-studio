# Sandbox-only override for `make e2e`: the stack runs the images build.sh just built (the
# committed Dockerfiles plus the egress proxy CA, with PDF and bundled models off; compose's own
# build can't add the CA), and host ports move so this stack runs beside other tickets' stacks
# on the same Docker daemon. Everything else is docker-compose.yml.
services:
  postgres:
    ports: !override ["42832:5432"]
  redis:
    ports: !override ["42879:6379"]
  rustfs:
    ports: !override ["42300:9000", "42301:9001"]
  mailpit:
    ports: !override ["42325:1025", "42825:8025"]
  api:
    image: rag-agent-studio/api:0408
    build: !reset null
    pull_policy: never
    ports: !override ["42800:8000"]
  worker:
    image: rag-agent-studio/api:0408
    build: !reset null
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0408
    build: !reset null
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0408
    build: !reset null
    pull_policy: never
    ports: !override ["42473:5173"]
