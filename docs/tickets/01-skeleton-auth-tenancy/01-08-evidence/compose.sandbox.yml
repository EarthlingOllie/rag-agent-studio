# Sandbox-only override: images built by sb0108/build.sh (the committed Dockerfiles plus the proxy CA),
# and host ports moved so this stack runs beside the other ticket's stack on the same Docker daemon.
services:
  postgres:
    ports: !override ["45432:5432"]
  redis:
    ports: !override ["46379:6379"]
  rustfs:
    ports: !override ["49000:9000", "49001:9001"]
  mailpit:
    ports: !override ["41025:1025", "48025:8025"]
  api:
    image: rag-agent-studio/api:0108
    pull_policy: never
    ports: !override ["48000:8000"]
  worker:
    image: rag-agent-studio/api:0108
    pull_policy: never
  beat:
    image: rag-agent-studio/api:0108
    pull_policy: never
  studio:
    image: rag-agent-studio/studio:0108
    pull_policy: never
    ports: !override ["45173:5173"]
