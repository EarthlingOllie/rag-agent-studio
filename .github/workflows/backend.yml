name: backend

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check (mypy --strict)
        run: uv run mypy
      - name: Tests, Alembic round trip and 100% line + branch coverage gate
        # fail_under = 100 with branch coverage is set in pyproject.toml (ADR-0008). One
        # pytest-xdist worker per CPU, each on its own database; pytest-cov combines their coverage.
        run: uv run pytest -n auto
