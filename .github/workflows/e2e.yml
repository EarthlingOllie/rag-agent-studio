name: e2e

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: Compose stack + Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: make e2e-install
      - name: Start the stack, wait for health checks, run Playwright
        # `docker compose up --wait` waits for the container health checks; the Playwright stack fixture
        # then waits for the API, database, Redis and worker through the Studio proxy before any test runs.
        run: make e2e
        env:
          CI: "true"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
