name: guardrails-eval

# The Guardrail attack evaluation suite (backend/evals/attack_suite.json, tickets 08-07, 13-07).
# Every case runs in both Retrieval Modes (Automatic and Agentic), and the report gives a pass
# rate per mode; the job fails when either mode fails, so CI gates both. On every push and PR it
# runs against the naive mocked model and fails on any unexpected outcome. Nightly (and on
# demand) it runs against a real model and fails when either mode is below the configured pass
# rate. Both publish the report (JSON and markdown) as an artifact and in the run summary.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"

jobs:
  attack-suite:
    name: Attack evaluation suite (mocked model)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Cache the local injection classifier's model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-prompt-injection-90c9989b1a342275dd0d1a95aad283c04e075671
      - name: Run the suite against the naive mocked model, in both Retrieval Modes
        run: make eval
      - name: Publish the report in the run summary
        if: always()
        run: cat backend/eval-report/attack-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-eval-report-mocked
          path: backend/eval-report/
          if-no-files-found: warn

  attack-suite-live:
    name: Attack evaluation suite (real model, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Repository variables and secret: which provider and model to evaluate, and its key.
      EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER }}
      EVAL_MODEL: ${{ vars.EVAL_MODEL }}
      EVAL_MIN_PASS_RATE: ${{ vars.EVAL_MIN_PASS_RATE || '0.85' }}
      EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the live model is configured
        run: |
          if [ -z "$EVAL_PROVIDER" ] || [ -z "$EVAL_MODEL" ]; then
            echo "::error::Set the EVAL_PROVIDER and EVAL_MODEL repository variables (and the EVAL_API_KEY secret) for the nightly live evaluation."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Cache the local injection classifier's model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-prompt-injection-90c9989b1a342275dd0d1a95aad283c04e075671
      - name: Run the suite against the real model, in both Retrieval Modes
        run: make eval-live
      - name: Publish the report in the run summary
        if: always()
        run: cat backend/eval-report/attack-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-eval-report-live-${{ github.run_id }}
          path: backend/eval-report/
          if-no-files-found: warn
          retention-days: 90
