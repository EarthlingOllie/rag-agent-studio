name: live

# The live Evaluation Run (spec 14, ticket 14-11), nightly and on demand: the demo Organisation is
# seeded with a real Provider Credential, and one Run of three cases (one per expectation kind)
# is answered and judged by the real model against the seed Knowledge Base. It is outside the
# coverage gate. So is one real Live Verdict (spec 15, ticket 15-07): a Visitor reply of the
# seeded HR helper, judged by the same real model; and one real Suggestion run (spec 16, ticket
# 16-07) over the seeded HR helper's evidence, asserting only that the model's output validates;
# and one real Judging guidance draft and check (spec 19, ticket 19-06) over a small set of
# reviews the test seeds, asserting the same.
# They use the nightly Attack evaluation's model
# settings: the EVAL_PROVIDER (anthropic or openai) and EVAL_MODEL repository variables and the
# EVAL_API_KEY secret.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-run:
    name: Live Evaluation Run (real model, nightly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_test
      TEST_REDIS_URL: redis://localhost:6379/15
      SEED_CREDENTIAL_PROVIDER: ${{ vars.EVAL_PROVIDER }}
      SEED_CREDENTIAL_MODEL: ${{ vars.EVAL_MODEL }}
      SEED_CREDENTIAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      # A missing credential fails the run instead of skipping it.
      LIVE_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, Redis and RustFS from docker-compose.yml
        working-directory: .
        run: make services
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install
        run: uv sync --frozen
      - name: One real Evaluation Run against the seed Knowledge Base
        run: uv run pytest -m live --no-cov -rs tests/live/test_evaluation_run_live.py
      - name: One real Live Verdict of a reply of the seeded HR helper
        run: uv run pytest -m live --no-cov -rs tests/live/test_live_verdict_live.py
      - name: One real Suggestion run over the seeded HR helper's evidence
        run: uv run pytest -m live --no-cov -rs tests/live/test_suggestion_run_live.py
      - name: One real Judging guidance draft and check over a small set of seeded reviews
        run: uv run pytest -m live --no-cov -rs tests/live/test_judging_guidance_live.py
