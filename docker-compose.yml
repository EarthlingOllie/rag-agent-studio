# Local stack: `make dev` starts everything below with one command.
name: rag-agent-studio

x-backend: &backend
  build:
    context: ./backend
  environment:
    ENVIRONMENT: local
    DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
    REDIS_URL: redis://redis:6379/0
    # Set LOGFIRE_TOKEN in .env to send traces to Logfire; otherwise they are printed as JSON.
    LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    # Email goes to Mailpit; read it at http://localhost:8025.
    MAILER: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    STUDIO_URL: ${STUDIO_URL:-http://localhost:5173}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: studio
      RUSTFS_SECRET_KEY: studio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - rustfs-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.serve"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.main", "--quiet", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.main", "--quiet", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  studio:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
