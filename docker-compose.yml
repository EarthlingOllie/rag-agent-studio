# Local stack: `make dev` starts everything below with one command.
name: rag-agent-studio

x-backend: &backend
  build:
    context: ./backend
    args:
      # PDF conversion (Docling's layout models, PyTorch CPU) and the bundled models make the
      # image large; set these to false in .env for a lighter image without PDF support.
      WITH_PDF: ${WITH_PDF:-true}
      BUNDLE_MODELS: ${BUNDLE_MODELS:-true}
  environment:
    ENVIRONMENT: local
    DATABASE_URL: postgresql+asyncpg://studio:studio@postgres:5432/studio
    REDIS_URL: redis://redis:6379/0
    # The local static-key wrapper's key, for envelope-encrypted secrets (TOTP secrets, later
    # Provider Credentials). A fixed development key: override it in .env; AWS uses KMS instead.
    LOCAL_KEY_WRAPPER_KEY: ${LOCAL_KEY_WRAPPER_KEY:-bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldCE=}
    # Provider Credentials are checked by the fake verifier locally: every key passes except
    # one starting `fake-fail-<reason>` (for Bedrock, a role name or secret access key starting
    # so). Set CREDENTIAL_VERIFIER=live in .env to call providers.
    CREDENTIAL_VERIFIER: ${CREDENTIAL_VERIFIER:-fake}
    # Models are the gateway's offline fakes locally. Set MODEL_GATEWAY=live in .env to call providers.
    MODEL_GATEWAY: ${MODEL_GATEWAY:-fake}
    # Set LOGFIRE_TOKEN in .env to send traces to Logfire; otherwise they are printed as JSON.
    LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
    # X-Forwarded-For is believed only from TRUSTED_PROXIES (app/core/client_ip.py); uvicorn's own
    # proxy-header handling is off. Unset locally, so the connection's peer is the client and no
    # one can pick their own address with the header; AWS lists the VPC and CloudFront there.
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    # Email goes to Mailpit; read it at http://localhost:8025.
    MAILER: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    STUDIO_URL: ${STUDIO_URL:-http://localhost:5173}
    # Uploaded Documents go to RustFS. Browsers PUT to presigned URLs on the Studio's origin,
    # whose dev proxy forwards /studio-documents to RustFS.
    OBJECT_STORE: s3
    OBJECT_STORE_BUCKET: studio-documents
    OBJECT_STORE_CREATE_BUCKET: "true"
    OBJECT_STORE_ENDPOINT_URL: http://rustfs:9000
    OBJECT_STORE_PUBLIC_ENDPOINT_URL: ${STUDIO_URL:-http://localhost:5173}
    OBJECT_STORE_ACCESS_KEY_ID: studio
    OBJECT_STORE_SECRET_ACCESS_KEY: studio-secret
    # Docling converts uploads, and the local Embedding Model (bundled in the image) embeds
    # them. EMBEDDER=fake in .env uses the deterministic embedder instead (no model download).
    DOCUMENT_CONVERTER: ${DOCUMENT_CONVERTER:-docling}
    EMBEDDER: ${EMBEDDER:-local}
    # The ingestion scan flags Chunks that look like instructions to an AI with the heuristic
    # classifier (spec 08 adds the ONNX one).
    INJECTION_CLASSIFIER: ${INJECTION_CLASSIFIER:-heuristic}
    # The input Guardrail checks every Visitor message with the local ONNX prompt-injection model
    # bundled in the image. A stack built with BUNDLE_MODELS=false sets INPUT_CLASSIFIER=heuristic
    # in .env (or the API downloads the model from Hugging Face on the first message).
    INPUT_CLASSIFIER: ${INPUT_CLASSIFIER:-local}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rustfs:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: studio
      RUSTFS_SECRET_KEY: studio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - rustfs-data:/data
    # The image has no health check; the API and worker wait for this one.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.serve"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.main", "--quiet", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.main", "--quiet", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  studio:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      OBJECT_STORE_PROXY_TARGET: http://rustfs:9000
      WIDGET_PROXY_TARGET: http://widget:5174
    ports: ["5173:5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
      widget:
        condition: service_healthy

  # The widget app and the Embed Snippet's loader (`embed.js`), built into the frontend image.
  # The Studio proxies /embed.js and /widget/assets here, so the widget shares the API's origin.
  widget:
    build:
      context: ./frontend
    working_dir: /app/apps/widget
    command: ["node", "/app/node_modules/vite/bin/vite.js", "preview", "--host", "0.0.0.0", "--port", "5174", "--strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174/embed.js').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  # A demo host page on its own origin, embedding an Agent: http://localhost:5175/?agent=agt_…
  # Add http://localhost:5175 to the Agent's Allowed Origins to let it show the widget.
  host:
    build:
      context: ./frontend
    command: ["node", "/app/apps/widget/host/serve.mjs"]
    environment:
      PORT: "5175"
      # Where browsers load embed.js from: the Studio's origin.
      WIDGET_URL: ${STUDIO_URL:-http://localhost:5173}
    ports: ["5175:5175"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5175/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  rustfs-data:
