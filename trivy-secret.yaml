# Trivy secret-scan configuration, passed to every `make image-scan` scan (--secret-config).
allow-rules:
  # The anthropic SDK's docstrings for Managed Agents sessions show a redacted principal
  # placeholder ("`{*****}` when runs carry no customer-named principal"), which the
  # gcp-service-account rule reads as a key. Only these two files are allowed.
  - id: anthropic-sdk-managed-agents-docstrings
    description: Redacted placeholder in anthropic SDK docstrings, not a credential
    path: .*site-packages/anthropic/types/beta/beta_managed_agents_session(_thread)?_agent\.py
