# Trivy secret-scan configuration, passed to every `make image-scan` scan (--secret-config).
allow-rules:
  # The gcp-service-account rule matches the text `"type": "service_account"` alone. The
  # anthropic SDK's Managed Agents docstrings quote that value (an Agent's default execution
  # principal, `{"type": "service_account"}`), with no key. A real service-account key file
  # also holds its private key, which the private-key rule still catches. (A path rule would
  # hide every finding in the file, a real private key included.)
  - id: service-account-type-without-key
    description: 'The text "type": "service_account" on its own is not a credential'
    regex: '"type": "service_account"'
